<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動向レポート作成ツール</title>
<style>
:root{--bg:#fafafa;--panel:#fff;--ink:#111;--sub:#6b7280;--line:#e5e7eb;--ok:#1f8a4c;--ng:#c8341f;--blue:#2456d6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.tabs{display:flex;gap:4px;margin-left:8px}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--sub);font-weight:600}
.tab.on{background:var(--ink);color:#fff}
.spacer{flex:1}
select,input[type=text],input[type=number],textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
select{width:auto}
textarea{resize:vertical;line-height:1.6}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st-draft{background:#eee;color:#555}.st-submitted{background:#e6eefc;color:var(--blue)}.st-approved{background:#e2f4ea;color:var(--ok)}.st-empty{background:#fdeceb;color:var(--ng)}
.deadline{font-size:13px;color:var(--sub)}.deadline b{color:var(--ink)}.deadline .late{color:var(--ng)}
main{flex:1;min-height:0;display:flex}
.side{width:230px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px;flex:none}
.side h4{margin:4px 8px 10px;font-size:12px;color:var(--sub)}
.svc{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;margin-bottom:2px;flex-wrap:wrap}
.svc:hover{background:#f2f2ef}.svc.on{background:#efefeb}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.svc .nm{flex:1;font-weight:600;font-size:13px}
.form{flex:1;overflow:auto;padding:24px 28px;max-width:660px}
.form h2{margin:0 0 4px;font-size:20px}
.form .meta{color:var(--sub);font-size:12px;margin-bottom:18px;line-height:1.9}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{color:var(--sub);font-weight:400}
.f{margin-bottom:12px}.f:last-child{margin-bottom:0}
.f label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.cnt.over{color:var(--ng);font-weight:700}
.cnt.warn{color:#c77700;font-weight:700}
.sub{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
.errs{background:#fdeceb;border:1px solid #f3c4bf;color:var(--ng);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.errs ul{margin:4px 0 0 18px;padding:0}
.previewCol{flex:1;min-width:0;background:#e9e9e4;overflow:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay{font-size:12px;color:var(--sub)}
.locked{opacity:.55;pointer-events:none}
.pane{flex:1;overflow:auto;padding:24px 28px}
.pane h2{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.gcell{background:#e9e9e4;border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.gcell .cap{font-size:12px;color:var(--sub);display:flex;gap:8px;align-items:center}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{background:#fafaf8;color:var(--sub);font-size:12px}
tr:last-child td{border-bottom:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.svcrow{display:grid;grid-template-columns:34px 1.4fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.svcrow input[type=color]{width:34px;height:34px;border:0;padding:0;background:none}
.note{font-size:12px;color:var(--sub);line-height:1.8}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin:6px 0 10px}
.flow span.s{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}

/* ===== report page: Figmaフレーム 595 x 842 px 基準（数値はFigma指定そのまま） ===== */
.pagebox{position:relative;flex:none}
.page{--k:1;width:595px;height:842px;position:relative;overflow:hidden;background:#fff center/100% 100% no-repeat;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:400;color:#222;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.page .bd{position:absolute;inset:0;padding:18px 16px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;font-size:calc(8px*var(--k))}
.page .fb{position:absolute;right:9px;top:0;width:146px;height:170px;background:var(--c);color:var(--ink2);border-radius:0 0 8px 8px;padding:8px}
.page .fb b{font-size:11px}.page .fb div{font-size:30px;font-weight:700;line-height:1.1;margin-top:8px}
.page .mo{position:absolute;right:37px;top:104px;font-size:56px;font-weight:600;line-height:56px;color:var(--ink2);letter-spacing:-.02em;text-align:right}
.page .top{min-height:150px;width:412px;flex:none}
.page .sh{display:flex;align-items:flex-end;margin-bottom:12px}
.page .sh::after{content:"";flex:1;height:0;border-bottom:1px solid #222}
.page .sh span{border:1px solid #222;border-bottom:0;background:transparent;padding:5px 10px 2px;font-weight:700;font-size:calc(8px*var(--k));line-height:1.4;border-radius:4px 4px 0 0}
.page .it{margin-bottom:16px;line-height:1.7}
.page .it.sq{margin-bottom:8px}
.page .it:last-child{margin-bottom:0}
.page .it h5{margin:0 0 1px;font-size:calc(11px*var(--k));font-weight:700;line-height:1.5;display:flex;align-items:center}
.page .it h5 .n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.4em;height:1.4em;line-height:1;background:#222;color:#fff;margin-right:.55em;font-size:.9em}
.page .it.sq h5{font-size:calc(9px*var(--k))}
.page .it.sq h5::before{content:"■";margin-right:.4em;flex:none}
.page .it p{margin:0;white-space:pre-wrap}
.page .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.page p.tx{margin:0;line-height:1.7;white-space:pre-wrap}
.page .msg{border:1px solid #666;position:relative;padding:14px 12px 10px;background:#fff}
.page .msg .lb{position:absolute;top:-1.3em;left:12px;background:#fff;padding:0 4px;font-weight:700;font-size:calc(10px*var(--k));white-space:nowrap;line-height:1.5;display:flex;align-items:center;gap:6px}
.page .msg .lb .t{position:relative;padding:0 8px;z-index:0}
.page .msg .lb .t::before{content:"";position:absolute;left:0;right:0;bottom:0;height:.95em;background:var(--brush,rgba(0,0,0,.08)) center/100% 100% no-repeat;z-index:-1}
.page .msg .lb i{display:block;width:1px;height:2.4em;background:#222;flex:none}
.page .msg .lb i.l{transform:rotate(-24deg)}
.page .msg .lb i.r{transform:rotate(24deg)}
.page .msg p{margin:0;font-size:calc(10px*var(--k));line-height:1.8;white-space:pre-wrap}
.page .ph{color:#bbb}
#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto!important;margin:0;padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .app,.toast,.login{display:none!important}
  #printRoot{display:block}
  /* A4は96dpiで 793.7×1122.5px。レポート(595×842)を1.333倍して、1枚にぴったり収める */
  #printRoot .page{box-shadow:none;margin:0;overflow:hidden;zoom:1.333;break-inside:avoid;break-after:page;page-break-after:always}
  #printRoot .page:last-child{break-after:auto;page-break-after:auto}
}
@media (max-width:980px){.previewCol{display:none}.form{max-width:none}}

/* ---- ヘッダー / ログイン（月次総会スライド生成と同じトンマナ） ---- */
.app{display:none}
body.authed .app{display:flex}
header.top{height:56px;padding:0 24px;gap:20px;flex-wrap:nowrap;background:#fff}
.logo i{width:32px;height:32px;border-radius:9px;background:#111;display:grid;place-items:center}
.logo i svg{width:16px;height:16px}
.logo span{font-size:15px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.user{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.user{position:relative}
.userbtn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:4px 6px;border-radius:99px;cursor:pointer}
.userbtn:hover{background:#f3f4f6}
.userbtn b{font-size:16px;font-weight:700}
.av{width:36px;height:36px;font-size:13px;background:#6a1b9a}
.umenu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.14);border:1px solid var(--line);padding:8px;z-index:30;min-width:200px}
.umenu.open{display:block}
.umenu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#c8223a;font-weight:700;font-size:16px;padding:14px 18px;border-radius:10px;cursor:pointer}
.umenu button:hover{background:#fdf2f3}
.login{position:fixed;inset:0;background:#fafafa;display:none;place-items:center;z-index:50}
body:not(.authed) .login{display:grid}
.login .box{text-align:center;width:min(360px,90vw)}
.login .ic{width:48px;height:48px;border-radius:12px;background:#111;margin:0 auto 14px;display:grid;place-items:center}
.login .ic svg{width:22px;height:22px}
.login h1{margin:0 0 6px;font-size:18px;font-weight:700}
.login p{margin:0 0 22px;font-size:12px;color:var(--sub)}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 22px;font-weight:600;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gbtn:hover{background:#f9fafb}
.login .err{margin-top:16px;font-size:12px;color:var(--ng);line-height:1.6}
.login .demo{margin-top:14px;font-size:11px;color:var(--sub)}
.hc{position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.hc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14);background:#dedfd8}
.more{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:#555;font-size:14px;letter-spacing:1px;cursor:pointer;display:grid;place-items:center;z-index:2}
.hc:hover .more{background:#fff}
.hc .cap{width:200px;padding:0;justify-content:flex-start;align-items:baseline;flex-wrap:wrap;gap:2px 8px}
.hc .cap b{font-size:13px}
.hc .cap span{font-size:12.5px}
.more:hover{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cmenu{display:none;position:absolute;top:46px;right:8px;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px;z-index:5;min-width:120px}
.cmenu.open{display:block}
.cmenu button.neutral{color:#111}
.cmenu button.neutral:hover{background:#f3f4f6}
.cmenu button{display:block;width:100%;text-align:left;border:0;background:none;color:#c8223a;font-weight:700;font-size:14px;padding:10px 14px;border-radius:8px;cursor:pointer}
.cmenu button:hover{background:#fdf2f3}
.gearbtn{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.gearbtn:hover{background:#f3f4f6}
.gearbtn .badge{background:#c8223a;color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:11px;display:none;place-items:center;padding:0 5px}
.reqrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.reqrow:last-of-type{border-bottom:0}
.viewonly{background:#f3f4f6;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.demobar{display:none;position:sticky;top:0;z-index:40;background:#111;color:#fff;font-size:12px;padding:8px 16px;gap:10px;align-items:center;flex-wrap:wrap}
body.demo .demobar{display:flex}
.demobar a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 12px;font-weight:600}
.demobar a.on{background:#fff;color:#111}
.umenu .vsw{display:none;border-bottom:1px solid var(--line);margin-bottom:6px;padding-bottom:6px}
.umenu .vsw .vl{font-size:11px;color:var(--sub);padding:6px 18px 2px}
.umenu .vsw button{color:#111;font-size:14px;padding:10px 18px}
.umenu .vsw button:hover{background:#f3f4f6}
.umenu .vsw button.on::before{content:"✓";margin-right:6px}
.umenu .vsw button:not(.on)::before{content:"";display:inline-block;width:1em;margin-right:6px}
.bellwrap{position:relative}
.bellbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:#333}
.bellbtn:hover{background:#f3f4f6}
.bellbtn svg{width:18px;height:18px}
.bellbtn .badge{position:absolute;top:-4px;right:-4px;background:#c8223a;color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px}
#bellMenu{min-width:340px;max-width:min(380px,90vw);padding:6px}
.btabs{display:flex;gap:4px;padding:4px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.btab{flex:1;white-space:nowrap;border:0;background:none;font-size:11px;font-weight:700;color:var(--sub);padding:6px 6px;border-radius:8px;cursor:pointer}
.btab.on{background:#f3f4f6;color:#111}
.btab i{font-style:normal;background:#c8223a;color:#fff;border-radius:8px;font-size:9px;padding:0 5px;margin-left:4px}
#bellMenu button.nitem.done b{color:var(--ok)}
.nhead{font-size:12px;color:var(--sub);padding:8px 12px 4px;font-weight:600}
#bellMenu button.nitem{display:block;width:100%;text-align:left;border:0;background:none;color:#111;font-weight:500;font-size:13px;line-height:1.6;padding:10px 12px;border-radius:10px;cursor:pointer}
#bellMenu button.nitem:hover{background:#f3f4f6}
#bellMenu button.nitem b{display:block;font-size:12px;margin-bottom:2px}
#bellMenu button.nitem.warn b{color:#c8223a}
#bellMenu button.nitem.info b{color:#2456d6}
#bellMenu .nempty{padding:14px 12px;font-size:13px;color:var(--sub)}
.hist{font-size:12px;line-height:1.9;color:var(--sub)}
.hist b{color:var(--ink)}
</style>
</head>
<body>
<div class="login" id="login"><div class="box">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
  <h1>動向レポート作成ツール</h1>
  <p>Googleアカウントでログインしてください</p>
  <button class="gbtn" id="gLogin"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span>Googleでログイン</span></button>
  <div class="err" id="loginErr"></div>
  <div class="demo" id="demoBox" style="display:none"><button class="btn sm" id="demoLogin">デモとして開く（このブラウザ内のみ保存）</button></div>
</div></div>
<div class="demobar" id="demoBar"></div>
<div class="app">
  <header class="top">
    <div class="logo" id="goHome" style="cursor:pointer"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></i><span>動向レポート作成ツール</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <div class="bellwrap"><button class="bellbtn" id="bellBtn" aria-label="通知"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="badge" id="bellBadge"></span></button><div class="umenu" id="bellMenu"></div></div>
    <button class="gearbtn" id="settingsBtn">⚙ 設定<span class="badge" id="reqBadge"></span></button>
    <div class="user"><button class="userbtn" id="userBtn" aria-haspopup="true" aria-expanded="false"><div class="av" id="uAv"></div><b id="uName"></b></button>
      <div class="umenu" id="uMenu"><div class="vsw" id="vsw"><div class="vl">見え方の確認（自分の権限は変わりません）</div><button data-va="admin">管理者</button><button data-va="manager">事業部長</button><button data-va="member">メンバー</button></div><button id="logout"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>ログアウト</span></button></div></div>
  </header>
  <main id="main"></main>
</div>
<div id="printRoot"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
/* 動向レポート作成ツール（プロトタイプ）
   Googleログイン(@madoguchi.inc限定)＋Firestoreに保存。config.js 未設定時はデモ（ブラウザ内保存） */
/* 文字数のルール（参考字数。「程度」の項目は、参考字数のOVER_RATE倍までは入力でき、それを超えると提出できない） */
const OVER_RATE=1.3;
const LIM={updTitle:{s:35,h:35},planTitle:{s:59,h:59},count:{s:270,h:Math.round(270*OVER_RATE)},ad:{s:270,h:Math.round(270*OVER_RATE)},advice:{s:100,h:Math.round(100*OVER_RATE)},message:{s:350,h:Math.round(350*OVER_RATE)}};
const itemsOf=(r,k)=>Math.min(3,Math.max(1,r[k].filter(x=>(x.title||'').trim()||(x.body||'').trim()).length,r['n_'+k]||0));
/* アップデート本文は、項目が少ないほど長く書ける（3項目なら100字程度／予定は65字程度） */
function limBody(r,kind){const n=itemsOf(r,kind),sft=Math.round((kind==='updates'?300:195)/n);return {s:sft,h:Math.round(sft*OVER_RATE)};}
function limitForKey(r,k){

async function flush(){
  clearTimeout(saveTimer);saveTimer=null;if(!me||!store||!me.canEdit)return;
  const now=new Date().toISOString(),w=who(),jobs=[],seen=new Set();
  Object.keys(S.reports).forEach(m=>Object.keys(S.reports[m]).forEach(id=>{
    const r=S.reports[m][id],k=key(m,id);seen.add(k);const b=bodyJson(r);if(snap[k]===b)return;
    const prev=snap[k]?JSON.parse(snap[k]):null;let action='edit';
    if(!prev){action='create';if(!r.createdBy){r.createdBy=w;r.createdAt=now;}}
    else if(prev.status!==r.status){action=r.status==='submitted'?'submit':r.status==='approved'?'approve':(prev.status==='submitted'||prev.status==='approved')?(r.note&&r.note!==prev.note?'reject':'withdraw'):'edit';}
    touch(r,action,w,now);snap[k]=b;jobs.push(store.setReport(m,id,r));
  }));
  Object.keys(snap).forEach(k=>{if(!seen.has(k)){const [m,id]=k.split('__');delete snap[k];jobs.push(store.delReport(m,id));}});
  const c=JSON.stringify([S.deadlineDay,S.services]);if(c!==cfgSnap){cfgSnap=c;jobs.push(store.setConfig());}
  try{await Promise.all(jobs);}catch(e){toast('保存に失敗しました：'+(e.message||e));}
  if(!jobs.length)return; patchEditInfo();
}

  [['count','直近の件数動向'],['ad','直近の広告動向'],['advice','ワンポイントアドバイス'],['message','運営者からのメッセージ']].forEach(([k,n])=>{if(!r[k].trim())e.push(n+'を入力してください');});

  if(r.status==='draft'&&!r.count&&!r.ad&&!r.advice&&!r.message&&!r.updates.some(x=>x.title||x.body)&&!r.plans.some(x=>x.title||x.body))return 'empty';return r.status;}
/* レイアウト：自動のときは、縦並び → 件数と広告を横並び → 広告とアドバイスを横並び の順に試し、
   項目ごとの余白が18pxを超える最初の形にする（どれも届かなければ余白が最大の形） */
const AUTO_MIN_GAP=18, LAYOUT_CACHE=new Map();
const LAY_NAME={stack:'すべて縦並び',side:'件数と広告動向を横並び',side2:'広告動向とアドバイスを横並び'};
function measureGap(svc,r,m,lay){
  const box=document.createElement('div');box.style.cssText='position:absolute;left:-9999px;top:0;width:595px;visibility:hidden';
  document.body.appendChild(box);box.innerHTML=pageHtml(svc,r,m,lay);
  const bd=box.querySelector('.bd'),cs=getComputedStyle(bd),avail=bd.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const kids=[...bd.children],sum=kids.reduce((a,e)=>a+e.offsetHeight,0);box.remove();
  return (avail-sum)/Math.max(1,kids.length-1);
}
function resolveLayout(svc,r,m){
  const key=svc.id+'|'+bodyJson(r);if(LAYOUT_CACHE.has(key))return LAYOUT_CACHE.get(key);
  let best='stack',bestGap=-1e9;
  for(const lay of ['stack','side','side2']){const g=measureGap(svc,r,m,lay);if(g>AUTO_MIN_GAP){best=lay;break;}if(g>bestGap){best=lay;bestGap=g;}}
  if(LAYOUT_CACHE.size>300)LAYOUT_CACHE.clear();LAYOUT_CACHE.set(key,best);return best;
}
const effLayout=(svc,r,m)=>r.layout==='auto'||!LAY_NAME[r.layout]&&r.layout!=='stack'?resolveLayout(svc,r,m):(r.layout||'stack');

/* ページ描画（レイアウトはすべて自動。デザイナーの微調整相当の処理） */
function pageHtml(svc,r,m,forceLay){
  const ph=(v,t)=>v?esc(v):`<span class="ph">${t}</span>`;
  const ups=r.updates.filter(x=>x.title||x.body), pls=r.plans.filter(x=>x.title||x.body);
  const num=ups.length>1;
  const sec=(title,inner)=>`<section><div class="sh"><span>${title}</span></div>${inner}</section>`;
  const lay=forceLay||effLayout(svc,r,m);
  const bCount=sec('直近の件数動向',`<p class="tx">${ph(r.count,'入力してください')}</p>`),bAd=sec('直近の広告動向',`<p class="tx">${ph(r.ad,'入力してください')}</p>`),bAdv=sec('ワンポイントアドバイス',`<p class="tx">${ph(r.advice,'入力してください')}</p>`);
  const dyn = lay==='side' ? `<div class="row2">${bCount}${bAd}</div>${bAdv}` : lay==='side2' ? `${bCount}<div class="row2">${bAd}${bAdv}</div>` : bCount+bAd+bAdv;
  const bg=svc.base?`background-image:url(${svc.base});`:'';
  return `<div class="page" style="${bg}--c:${svc.color};--ink2:${svc.ink||inkOn(svc.color)}">
   ${svc.base?'':`<div class="fb"><b>${esc(svc.name)}</b><div>動向<br>レポート</div></div>`}
   <div class="mo">${Number(m.slice(5))}</div>

/* 全体が溢れる場合のみ文字を少しずつ縮小 */
function fitAll(root){root.querySelectorAll('.page').forEach(p=>{const bd=p.querySelector('.bd');let k=1;p.style.setProperty('--k',k);
  while(bd.scrollHeight>bd.clientHeight+1&&k>0.7){k-=0.02;p.style.setProperty('--k',k.toFixed(2));}});}
const scaled=(html,w)=>{const sc=w/595;return `<div class="pagebox" style="width:${w}px;height:${842*sc}px"><div style="position:absolute;left:0;top:0;width:595px;height:842px;transform:scale(${sc});transform-origin:0 0">${html}</div></div>`;};
/* PDFを、画面を挟まずにそのままダウンロードする（ブラウザの中でPDFを作る。保存先は、ブラウザの「ダウンロード」の設定どおり） */
const PDF_LIBS=['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
async function ensurePdfLibs(){
  if(!window.html2canvas)await loadScript(PDF_LIBS[0]);
  if(!(window.jspdf&&window.jspdf.jsPDF))await loadScript(PDF_LIBS[1]);
}
async function makeReportPdf(svc,r,m){
  await ensurePdfLibs();
  if(svc.base)await new Promise(res=>{const i=new Image();i.onload=i.onerror=res;i.src=svc.base;});
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const box=document.createElement('div');
  box.style.cssText='position:fixed;left:-10000px;top:0;width:595px;height:842px;background:#fff';
  box.innerHTML=pageHtml(svc,r,m);document.body.appendChild(box);
  try{
    fitAll(box);
    const page=box.querySelector('.page');page.style.boxShadow='none';
    const canvas=await html2canvas(page,{scale:3,useCORS:true,backgroundColor:'#ffffff',logging:false});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'pt',format:[595,842],compress:true});
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,595,842);
    return pdf;
  }finally{box.remove();}
}
async function downloadReportPdf(svc,r,m){
  const name=`${svc.name}_${m.replace('-','')}`;
  try{(await makeReportPdf(svc,r,m)).save(name+'.pdf');return true;}
  catch(e){console.error(e);toast('PDFを直接保存できませんでした。保存の画面を開きます');printPages([pageHtml(svc,r,m)],name);return false;}
}
function printPages(list,title){const pr=$('#printRoot');pr.innerHTML=list.join('');fitAll(pr);document.title=title;window.print();document.title='動向レポート作成ツール';}

      <div class="card"><h3>③ 直近の件数動向・広告動向 <small>短ければ自動で横並び</small></h3>
        ${inp('直近の件数動向','count',LIM.count,5)}${inp('直近の広告動向','ad',LIM.ad,5)}
        <div class="f"><label><span>レイアウト</span></label><select data-k="layout"><option value="auto">自動（余白が18px以下なら横並び）</option><option value="stack">すべて縦並び</option><option value="side">件数と広告動向を横並び</option><option value="side2">広告動向とアドバイスを横並び</option></select></div></div>
      <div class="card"><h3>④ ワンポイントアドバイス</h3>${inp('アドバイス','advice',LIM.advice,3)}</div>
      <div class="card"><h3>⑤ 運営者からのメッセージ</h3>${inp('メッセージ','message',LIM.message,6)}</div>
    </div>
    <div class="bar">
      <button class="btn" id="copyPrev" ${locked?'disabled':''}>前月の内容をコピー</button>
      <button class="btn" id="bulk" ${locked?'disabled':''}>テキスト一括貼り付け</button>
      <span class="spacer"></span>
      ${locked?'':(r.status==='submitted'||r.status==='approved'?'<button class="btn" id="withdraw">提出を取り下げる</button>':'<button class="btn pri" id="submitBtn">提出</button>')}
    </div>
    <div class="card" style="margin-top:18px"><h3>作成・編集履歴</h3><div class="hist">${histHtml(r)}</div></div>
    <p class="note" style="margin-top:10px">入力内容は自動で保存されます。入力が終わったら「提出」を押してください。誰がいつ編集したかが記録されます。</p>
  </div>
  <div class="previewCol"><div class="lay" id="lay"></div><div id="pv"></div><button class="btn sm" id="pdf1">このサービスのPDFを保存</button></div>`;
  $('#back').onclick=()=>guardLeave(()=>{ui.tab=ui.back||'home';render();});
  const sel=$('[data-k=layout]');sel.value=r.layout;
  document.querySelectorAll('#fields [data-k]').forEach(el=>el.oninput=el.onchange=()=>{
    const path=el.dataset.k.split('.');let o=r;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=el.value;
    if(r.status==='empty')r.status='draft';
    r.updated=new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});save();
    document.querySelectorAll('#fields .cnt').forEach(c=>{const k=c.dataset.f,l=limitForKey(r,k),n=len(k.split('.').reduce((o,x)=>o[x],r));c.textContent=cntText(n,l);c.className='cnt '+cntCls(n,l);});
    draw(svc,r,m);});
  $('#copyPrev')?.addEventListener('click',()=>{const p=(S.reports[prevMonth(m)]||{})[svc.id];if(!p){toast('前月のデータがありません');return;}
    const c=structuredClone(p);c.status='draft';c.note='';S.reports[m][svc.id]=c;save();render();toast('前月の内容をコピーしました。更新してください');});
  $('#bulk')?.addEventListener('click',()=>bulkDialog(r));
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add;const n=nShow(k);r['n_'+k]=Math.min(3,n+1);if(r.status==='empty')r.status='draft';save();renderKeep(n<3?`${k}.${n}.title`:null);});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.del.split(':');const n=nShow(k);r[k].splice(+i,1);r[k].push({title:'',body:''});r['n_'+k]=Math.max(1,n-1);save();renderKeep();});
  $('#submitBtn')?.addEventListener('click',()=>submitReport(m,svc,r));
  $('#withdraw')?.addEventListener('click',async()=>{r.status='draft';await flush();renderKeep();toast('提出を取り下げました');});
  $('#pdf1').onclick=()=>downloadReportPdf(svc,r,m);
  draw(svc,r,m);
}
function draw(svc,r,m){const box=$('#pv');if(!box)return;const w=Math.min($('.previewCol').clientWidth-40,520);
  box.innerHTML=scaled(pageHtml(svc,r,m),w);fitAll(box);
  $('#lay').textContent=`レイアウト：${LAY_NAME[effLayout(svc,r,m)]}${r.layout==='auto'?'（自動）':''}`;}

const BULK=`アップデート1: 見出し | 本文
アップデート2: 見出し | 本文
予定1: 見出し | 本文
予定2: 見出し | 本文
件数動向: 本文
広告動向: 本文
アドバイス: 本文
メッセージ: 本文`;
function bulkDialog(r){
  const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9';
  d.innerHTML=`<div class="card" style="width:min(640px,92vw);margin:0"><h3>テキスト一括貼り付け <small>この書式で事業部長に書いてもらうとコピペで完了</small></h3>
  <textarea id="bt" rows="12" placeholder="${esc(BULK)}"></textarea>
  <p class="note">「アップデート1〜3」「予定1〜3」は「見出し | 本文」。「件数動向」「広告動向」「アドバイス」「メッセージ」は本文のみ。複数行の本文は次の項目名が出るまで続きます。</p>
  <div class="bar"><button class="btn sm" id="bs">書式を入れる</button><span class="spacer"></span><button class="btn" id="bc">キャンセル</button><button class="btn pri" id="bo">反映</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#bs').onclick=()=>d.querySelector('#bt').value=BULK;
  d.querySelector('#bc').onclick=()=>d.remove();
  d.querySelector('#bo').onclick=()=>{
    const re=/^\s*(アップデート|予定)\s*([1-3１-３])\s*[:：]\s*(.*)$|^\s*(件数動向|広告動向|アドバイス|メッセージ)\s*[:：]\s*(.*)$/;
    const map={件数動向:'count',広告動向:'ad',アドバイス:'advice',メッセージ:'message'};let cur=null;
    d.querySelector('#bt').value.split('\n').forEach(line=>{const mm=line.match(re);
      if(mm){ if(mm[1]){const i=Number(mm[2].replace(/[１-３]/,c=>String.fromCharCode(c.charCodeAt(0)-65248)))-1,k=mm[1]==='予定'?'plans':'updates',p=mm[3].split(/\s*[|｜]\s*/);
          r[k][i]={title:p[0]||'',body:p.slice(1).join(' ')};cur={k,i};}
        else{r[map[mm[4]]]=mm[5];cur={f:map[mm[4]]};} }
      else if(cur&&line.trim()){ if(cur.f)r[cur.f]+='\n'+line.trim(); else r[cur.k][cur.i].body+=(r[cur.k][cur.i].body?'\n':'')+line.trim(); }});
    if(r.status==='empty')r.status='draft';save();d.remove();renderKeep();toast('反映しました。文字数を確認してください');};
}

function viewAll(){
  const m=curIssue(),done=S.services.filter(s=>['submitted','approved'].includes(effStatus(m,s.id))).length;
  $('#main').innerHTML=`<div class="pane"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
    <h2 style="margin:0">${mLabel(m)} 全体プレビュー</h2><span class="deadline">提出 ${done}/${S.services.length}</span><span class="spacer"></span>
    <button class="btn" id="exp">データ書出し(JSON)</button><label class="btn" style="cursor:pointer">データ読込<input type="file" id="imp" accept=".json" hidden></label>
    <button class="btn pri" id="pdf">全サービスをPDFで保存</button></div>
    <div class="grid" id="g">${S.services.map(s=>`<div class="gcell"><div class="cap"><b>${esc(s.name)}</b><span class="pill ${STATUS[effStatus(m,s.id)][1]}">${STATUS[effStatus(m,s.id)][0]}</span><button class="btn sm" data-p="${s.id}">PDF</button></div>${scaled(pageHtml(s,peek(m,s.id),m),280)}</div>`).join('')}</div></div>`;
  fitAll($('#g'));
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const s=S.services.find(x=>x.id===b.dataset.p);downloadReportPdf(s,peek(m,s.id),m);});
  $('#pdf').onclick=()=>{if(done<S.services.length&&!confirm('未提出のサービスがあります。このまま出力しますか？'))return;printPages(S.services.map(s=>pageHtml(s,peek(m,s.id),m)),`動向レポート_${m}`);};
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=`doukou-${m}.json`;a.click();};
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=JSON.parse(t);save();init();toast('読み込みました');}catch(x){toast('読込に失敗しました');}});};
}

function viewSettings(){
  $('#main').innerHTML='<div class="pane"></div>';   // 設定は「編集権限」だけ
  const pane=document.querySelector('.pane');
  const reqs=requests.slice().sort((a,b)=>String(a.at)<String(b.at)?-1:1);
  pane.insertAdjacentHTML('afterbegin',`<button class="btn sm" id="setHome" style="margin-bottom:14px">← ホームに戻る</button>
   <h2>設定　<small style="font-size:13px;color:var(--sub);font-weight:600">編集権限</small></h2>
   <div class="card"><h3>権限の申請 <small>${reqs.length}件</small></h3>${reqs.length?reqs.map(x=>`<div class="reqrow"><div><b>${esc(x.name)}</b><br><span class="note">${esc(x.email)}　${fmt(x.at)}</span></div><span class="spacer"></span><button class="btn sm ok" data-ap="${esc(x.email)}">承認</button><button class="btn sm" data-rj="${esc(x.email)}">却下</button></div>`).join(''):'<p class="note" style="margin:0">申請はありません。</p>'}</div>
   <div class="card"><h3>追加で承認した編集者 <small>${access.editors.length}名</small></h3>${access.editors.length?access.editors.map(e=>`<div class="reqrow"><span>${esc(e)}</span><span class="spacer"></span><button class="btn sm" data-rv="${esc(e)}">権限を外す</button></div>`).join(''):'<p class="note" style="margin:0">追加で承認した人はいません。</p>'}<p class="note" style="margin:10px 0 0">最初から編集権限のあるメンバー（設定ファイルで固定）と管理者は、ここには表示されません。</p></div>`);
  $('#setHome').onclick=()=>{ui.tab='home';render();};
  const run=async(fn,msg)=>{try{await fn();toast(msg);applyRoleUI();render();}catch(e){toast('失敗しました：'+(e.message||e));}};
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>run(()=>store.approve(b.dataset.ap),'承認しました。編集できるようになります'));
  document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>run(()=>store.reject(b.dataset.rj),'却下しました'));
  document.querySelectorAll('[data-rv]').forEach(b=>{b.onclick=()=>{if(confirm(b.dataset.rv+' の編集権限を外しますか？'))run(()=>store.revoke(b.dataset.rv),'権限を外しました');};});
}
function viewAdmin(){
  const m=curIssue();
  $('#main').innerHTML=`<div class="pane"><h2>進捗（${mLabel(m)}）</h2>
  <table><thead><tr><th>サービス</th><th>担当</th><th>状態</th><th>最終更新</th><th>文字数</th><th></th></tr></thead><tbody>
  ${S.services.map(s=>{const st=effStatus(m,s.id),r=peek(m,s.id),e=validate(r).filter(x=>x.includes('オーバー')).length;
   return `<tr><td><span class="dot" style="background:${s.color};display:inline-block;margin-right:8px"></span>${esc(s.name)}</td><td>${esc(s.owner)}</td><td><span class="pill ${STATUS[st][1]}">${STATUS[st][0]}</span></td><td>${r.updatedBy?esc(r.updatedBy.name)+'<br><span class="note">'+fmt(r.updatedAt)+'</span>':'-'}</td><td>${e?`<span style="color:var(--ng)">超過${e}件</span>`:'OK'}</td>
   <td style="text-align:right">${st==='submitted'?`<button class="btn sm ok" data-a="${s.id}">承認</button> <button class="btn sm" data-r="${s.id}">差し戻し</button>`:st==='approved'?`<button class="btn sm" data-r="${s.id}">承認取消</button>`:`<button class="btn sm" data-nudge="${s.id}">催促文をコピー</button>`}</td></tr>`;}).join('')}
  </tbody></table>
  <h2 style="margin-top:32px">テンプレート設定 <small style="font-size:12px;color:var(--sub);font-weight:400">※ここだけ年1回程度メンテナンス</small></h2>
  <div class="card"><div class="f"><label><span>締切日（毎月）</span></label><input type="number" id="dl" min="1" max="28" value="${S.deadlineDay}" style="width:100px"></div>
  <div class="f"><label><span>サービス一覧（ブランドカラー / 名前 / 担当）</span></label>
  ${S.services.map((s,i)=>`<div class="svcrow"><input type="color" data-c="${i}" value="${s.color}"><input type="text" data-nm="${i}" value="${esc(s.name)}"><input type="text" data-o="${i}" value="${esc(s.owner)}"><button class="btn sm" data-d="${i}">削除</button></div>`).join('')}
  <button class="btn sm" id="addSvc">＋ サービスを追加</button></div></div>
  <div class="card"><h3>過去号データの取り込み <small>管理者のみ・最初の1回</small></h3><p class="note" style="margin:0 0 10px">Figmaから取り込んだ過去号（JSON）を、ログに登録します。すでにあるレポートは上書きしません。</p><input type="file" id="seedFile" accept=".json"></div>
  <p class="note">サービスを追加すると、自動でレポートが1つ増えます。バッジの文字色はブランドカラーの明るさから自動で白/黒を選びます。</p></div>`;
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{getReport(m,b.dataset.a).status='approved';save();render();});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const note=prompt('差し戻しコメント（承認取消の場合は空でOK）','');if(note===null)return;const r=getReport(m,b.dataset.r);r.status='draft';r.note=note;save();render();});
  document.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>{const s=S.services.find(x=>x.id===b.dataset.nudge);navigator.clipboard?.writeText(`${s.owner}\n${mLabel(m)}の動向レポート入力をお願いします（締切：${Number(m.slice(5))}/${S.deadlineDay}）。`);toast('催促文をコピーしました');});
  $('#dl').onchange=e=>{S.deadlineDay=Math.min(28,Math.max(1,+e.target.value||12));save();render();};
  document.querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{S.services[el.dataset.c].color=el.value;save();});
  document.querySelectorAll('[data-nm]').forEach(el=>el.onchange=()=>{S.services[el.dataset.nm].name=el.value;save();});
  document.querySelectorAll('[data-o]').forEach(el=>el.onchange=()=>{S.services[el.dataset.o].owner=el.value;save();});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(S.services.length<2)return;if(confirm('削除しますか？')){S.services.splice(+b.dataset.d,1);save();render();}});
  $('#seedFile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{importSeed(JSON.parse(t));}catch(x){toast('JSONを読み込めませんでした');}});};
  $('#addSvc').onclick=()=>{S.services.push({id:'s'+Date.now(),name:'新サービス',color:'#6b4bd6',owner:'担当者'});save();render();};
}

function viewSpec(){
  $('#main').innerHTML=`<div class="pane" style="max-width:860px"><h2>この仕組みで何が変わるか</h2>
  <div class="two"><div class="card"><h3>現状</h3><p class="note">事業部長 → テキスト送付(12日)<br>→ デザイナーがFigmaに転記<br>→ 文字量に合わせて横並び等を微調整<br>→ 確認・修正 → PDF書出し<br><b>毎月デザイナー工数が発生（Cランク）</b></p></div>
  <div class="card"><h3>この仕組み</h3><p class="note">事業部長/営業 → フォームに入力 or 一括貼付<br>→ 文字数チェックを通して提出<br>→ 管理者が承認 → ボタンでPDF<br><b>デザイナー工数ゼロ（リニューアル時のみ関与）</b></p></div></div>
  <div class="card"><h3>デザイナーの微調整を置き換える仕組み</h3><p class="note">
  ① <b>5色展開</b>：サービスごとのブランドカラーを設定に持ち、枠線・バッジ・文字色を自動切替。<br>
  ② <b>アップデートの件数</b>：1件なら番号なし、2件以上なら 1・2・3 の番号付きで自動表示。空欄は詰める。<br>
  ③ <b>件数動向と広告動向</b>：標準は縦並び。横並びにしたい時だけ入力画面で切り替え。<br>
  ④ <b>文字数上限</b>：超過すると提出不可。想定外に溢れた場合のみ全体の文字を少し縮小。</p></div>
  <div class="card"><h3>運用フロー（毎月）</h3><div class="flow"><span class="s">〜10日 入力依頼</span>→<span class="s">12日 提出締切</span>→<span class="s">13日 確認・承認</span>→<span class="s">14日 PDF出力・配信</span></div></div></div>`;
}

window.addEventListener('resize',()=>{if(ui.tab==='edit'){const s=S.services.find(x=>x.id===ui.svc);if(s)draw(s,getReport(ui.month,s.id),ui.month);}});
boot();
